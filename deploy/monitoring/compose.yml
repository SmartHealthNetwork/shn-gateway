# A local monitoring stack for an SHN Smart Gateway: Prometheus 3, receiving the gateway's
# metrics over OTLP and evaluating the alert rules, and Grafana with the dashboard. It is an
# example to start from, not a production deployment.
#
#   GF_SECURITY_ADMIN_PASSWORD=<choose one> docker compose -f compose.yml up -d
#
# Both are published on loopback only, so the gateway runs on the same host. Point it at
# Prometheus with OTLP push:
#   OTEL_METRICS_EXPORTER=otlp
#   OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://localhost:9090/api/v1/otlp/v1/metrics
# (a gateway in a container joins this project's network and uses
# http://prometheus:9090/api/v1/otlp/v1/metrics instead), or let Prometheus scrape the
# gateway's pull listener: add the scrape job sketched in prometheus/prometheus.yml (the
# gateway's docs/CONFIGURATION.md, "OpenTelemetry metrics export").
#
# Grafana: http://localhost:3000 (admin and the password you chose). Prometheus:
# http://localhost:9090.
services:
  prometheus:
    # prom/prometheus v3.15.0
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    # grafana/grafana 12.4.12
    image: grafana/grafana:12.4.12@sha256:83be3e511ede559bee80e2215bb1987cb1246075461cb961beb515b0341e7aea
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/shn.yml:ro
      - ./grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/shn.yml:ro
      - ./grafana/shn-gateway.json:/var/lib/grafana/dashboards/shn-gateway.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
