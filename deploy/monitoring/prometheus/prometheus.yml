# Prometheus for the example stack (compose.yml): an OTLP receiver for the gateway's push, and
# the alert rules. The gateway's resource attributes that name a replica become labels.
global:
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/alerts.yml

otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - service.version
    - shn.role
    - shn.holder_id
    - deployment.environment.name

storage:
  tsdb:
    out_of_order_time_window: 30m

